[project]
name = "claudeshare"
version = "1.0.0"
description = "Isolated Claude CLI desktops in the browser, from one shared login"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "strawberry-graphql[fastapi]>=0.250",
    "psutil>=6.0",
    "httpx>=0.27",
    "rich>=13.9",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
claudeshare = "cli.main:main"
install = "system.bootstrap:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "cli", "setup", "system"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
